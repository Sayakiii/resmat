# Connexion MariaDB : valeurs par défaut modifiables via variables d'environnement
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/resmat}
spring.datasource.username=${DB_USER:resmat}
spring.datasource.password=${DB_PASSWORD:resmat}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Templates Mustache en .hbs
spring.mustache.suffix=.hbs
spring.mustache.charset=UTF-8
# Nécessaire pour accéder au jeton CSRF ({{_csrf.token}}) dans les templates
spring.mustache.servlet.expose-request-attributes=true
